name: TestFlight

# Every merge into main goes to testers. The gate is the pull request review —
# once something is on main, it ships.
on:
  push:
    branches: [main]
    # Docs and agent config don't ship in the app, so a merge that only touches
    # these shouldn't spend EAS build minutes. workflow_dispatch still runs
    # regardless of what changed.
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.github/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  # Only cancels the GitHub Actions job, not the EAS build itself — that keeps
  # running on Expo's servers and still gets submitted. This just stops two
  # workflow runs from racing each other; it does not save EAS build minutes.
  group: testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The project has no tests, so lint and typecheck are the whole automatic
      # safety net. A failure here stops the build before it costs anything.
      - name: Lint and typecheck
        run: npm run release:check

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive
